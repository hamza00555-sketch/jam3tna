    :root{
    --violet:#b07ff0;
    --violet-bright:#cea0ff;
    --gold:#ffce5a;
    --cream:#efe8e1;
    --text-light:#cdbfe8;
    --muted:#a294cc;
    --card-inner:#271c57;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Cairo',system-ui,sans-serif;
    background:#0e0a22;
    color:#fff;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }

  /* ===== Phone-screen content (NO device frame) ===== */
  .screen{
    position:relative;
    width:100%;
    max-width:412px;
    min-height:100vh;
    background:
      radial-gradient(125% 75% at 50% 0%, #4c2c84 0%, #321e69 42%, #1d1248 78%, #160e3c 100%);
    overflow:hidden;
    padding-bottom:108px;
  }

  /* ===== Status bar ===== */
  .statusbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px 4px;font-weight:700;font-size:15px;color:#fff;
  }
  .statusbar .sb-icons{display:flex;align-items:center;gap:7px;}
  .statusbar svg{height:14px;width:auto;fill:#fff;}

  /* ===== Header / mosque banner ===== */
  .header{position:relative;padding:8px 18px 0;overflow:hidden;}
  .glow{
    position:absolute;left:50%;top:6px;transform:translateX(-50%);
    width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle, rgba(176,134,244,.40), rgba(176,134,244,0) 62%);
    pointer-events:none;
  }
  .mosque-bg{
    position:absolute;left:0;right:0;top:30px;width:100%;
    display:block;pointer-events:none;user-select:none;
  }
  .top-row{
    position:relative;z-index:3;direction:ltr;display:flex;align-items:center;justify-content:space-between;
  }
  .icon-btn{
    width:50px;height:50px;border-radius:16px;
    background:rgba(48,30,96,.55);border:1px solid rgba(255,255,255,.10);
    display:grid;place-items:center;color:#fff;backdrop-filter:blur(4px);
    box-shadow:0 6px 16px rgba(0,0,0,.25);
  }
  .icon-btn svg{width:22px;height:22px;}
  .points{
    direction:ltr;display:flex;align-items:center;gap:7px;
    background:rgba(48,30,96,.55);border:1px solid rgba(255,255,255,.10);
    padding:11px 16px;border-radius:999px;color:#fff;font-weight:800;font-size:16px;
    backdrop-filter:blur(4px);box-shadow:0 6px 16px rgba(0,0,0,.25);
  }
  .points svg{width:20px;height:20px;color:var(--gold);}

  .welcome{position:relative;z-index:3;text-align:center;margin-top:96px;padding-bottom:14px;}
  .welcome h1{
    font-family:'Cairo',sans-serif;font-weight:900;font-size:33px;color:#fff;
    text-shadow:0 4px 22px rgba(0,0,0,.45);letter-spacing:.5px;
  }
  .welcome p{
    margin-top:8px;color:var(--text-light);font-size:15.5px;font-weight:500;
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .welcome p svg{width:17px;height:17px;color:var(--gold);}

  /* ===== Generic content padding ===== */
  .body{padding:6px 18px 0;display:flex;flex-direction:column;gap:16px;}

  /* ===== Mission card ===== */
  .mission{
    direction:ltr;display:flex;align-items:center;gap:6px;
    background:linear-gradient(150deg,#4d2f8a 0%,#3a2370 100%);
    border:1px solid rgba(255,255,255,.10);
    border-radius:24px;padding:14px 18px 16px;
    box-shadow:0 12px 30px rgba(0,0,0,.30);
  }
  .mission .art{width:118px;flex:0 0 118px;}
  .mission .art img{width:100%;display:block;}
  .mission .info{flex:1;direction:rtl;text-align:right;}
  .mission .info .ttl{
    display:flex;align-items:center;justify-content:flex-start;gap:8px;
    font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;color:#fff;
  }
  .mission .info .ttl svg{width:21px;height:21px;color:var(--violet-bright);}
  .mission .info .desc{margin-top:7px;color:var(--text-light);font-size:13.5px;line-height:1.7;font-weight:500;}
  .progress-wrap{display:flex;align-items:center;gap:10px;margin-top:13px;direction:ltr;}
  .progress-wrap .pnum{color:#fff;font-weight:800;font-size:13.5px;flex:0 0 auto;}
  .bar{flex:1;height:9px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;}
  .bar > i{display:block;height:100%;width:60%;border-radius:999px;
    background:linear-gradient(90deg,#a071ec,#cba2f8);}

  /* ===== Enter lesson button ===== */
  .enter{
    direction:ltr;display:flex;align-items:center;gap:12px;
    background:#f4eff6;border-radius:20px;padding:9px 16px;
    box-shadow:0 14px 28px rgba(0,0,0,.28);
  }
  .enter .circle{
    width:46px;height:46px;flex:0 0 46px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#7a47cf,#5a31a4);
    display:grid;place-items:center;color:#fff;
    box-shadow:0 6px 14px rgba(90,49,164,.45);
  }
  .enter .circle svg{width:24px;height:24px;}
  .enter .txt{
    flex:1;text-align:center;font-family:'Cairo',sans-serif;font-weight:800;
    font-size:19px;color:#2a1a55;
  }
  .enter .chev{color:#9b8fb5;display:grid;place-items:center;}
  .enter .chev svg{width:22px;height:22px;}

  /* ===== Progress card ===== */
  .progress-card{
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;padding:16px 18px 18px;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
  }
  .card-head{
    display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-bottom:6px;
    font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;color:#fff;
  }
  .card-head svg{width:20px;height:20px;color:var(--violet-bright);}
  .rings{direction:ltr;display:flex;justify-content:space-around;align-items:center;padding:8px 0 4px;}
  .ring-item{display:flex;flex-direction:column;align-items:center;gap:9px;}
  .ring{
    width:80px;height:80px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--violet-bright) calc(var(--p)*1%), rgba(255,255,255,.10) 0);
  }
  .ring i{
    width:62px;height:62px;border-radius:50%;background:var(--card-inner);
    display:grid;place-items:center;color:var(--violet-bright);
  }
  .ring i svg{width:27px;height:27px;}
  .ring-item .pct{color:#fff;font-weight:800;font-size:15px;}

  .divider{height:1px;background:rgba(255,255,255,.09);margin:16px 0 14px;}

  .stats{display:flex;direction:rtl;}
  .stats .col{flex:1;text-align:center;padding:0 6px;}
  .stats .col + .col{border-inline-start:1px solid rgba(255,255,255,.10);}
  .stats .col .name{font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;color:#fff;}
  .stats .col .msg{margin-top:5px;font-size:13px;color:#d9b86a;font-weight:600;}

  /* ===== Badge card ===== */
  .badge-card{
    direction:ltr;display:flex;align-items:center;gap:6px;
    background:linear-gradient(160deg,#f3ede6,#e7ded3);
    border-radius:24px;padding:14px 18px;
    box-shadow:0 12px 30px rgba(0,0,0,.28);
  }
  .badge-card .art{width:120px;flex:0 0 120px;}
  .badge-card .art img{width:100%;display:block;}
  .badge-card .info{flex:1;direction:rtl;text-align:right;}
  .badge-card .info .label{color:#8a6fb0;font-weight:700;font-size:14px;}
  .badge-card .info .big{
    font-family:'Cairo',sans-serif;font-weight:900;font-size:23px;color:#3a2470;margin-top:2px;
  }
  .badge-card .info .sub{margin-top:8px;color:#6b6275;font-size:13px;line-height:1.7;font-weight:500;}

  /* ===== Bottom nav ===== */
  .nav{
    position:fixed;left:50%;transform:translateX(-50%);bottom:0;
    width:100%;max-width:412px;
    background:#221750;border-top:1px solid rgba(255,255,255,.06);
    border-radius:26px 26px 0 0;
    display:flex;direction:rtl;align-items:flex-end;justify-content:space-around;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(0,0,0,.30);
  }
  .nav .item{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    color:#8d7dc0;font-size:12px;font-weight:600;flex:1;
  }
  .nav .item svg{width:25px;height:25px;}
  .nav .item.center{position:relative;}
  .nav .item.center .bubble{
    width:58px;height:58px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#8a55e0,#6a3bc4);
    display:grid;place-items:center;color:#fff;
    box-shadow:0 8px 20px rgba(124,70,207,.55);
    margin-top:-30px;border:4px solid #221750;
  }
  .nav .item.center .bubble svg{width:28px;height:28px;}
  .nav .item.center{color:#e7defb;}
</style>
</head>

          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.3l6.5-.9z"/></svg>
          <span>125</span>
        </div>
      </div>
      <div class="welcome">
        <h1>مرحبًا طلال</h1>
        <p>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 6.8L20 10l-6.4 1.2L12 18l-1.6-6.8L4 10l6.4-1.2z"/></svg>
          أنتم مميزون، ورحلتك اليوم رائعة
        </p>
      </div>
    </header>

    <div class="body">

      <!-- Mission card -->
      <section class="mission">
        <div class="art"><img src="assets/book.png" alt="مهمة اليوم" /></div>
        <div class="info">
          <div class="ttl">
            مهمة اليوم
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>
          </div>
          <div class="desc">اقرأ 5 آيات من سورة الملك وتعلّم معنى الكلمات الجديدة</div>
          <div class="progress-wrap">
            <div class="bar"><i></i></div>
            <span class="pnum">3/5</span>
          </div>
        </div>
      </section>

      <!-- Enter lesson -->
      <button class="enter">
        <span class="circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.6C10.5 5.5 8.4 5 6 5H3v13h3c2.4 0 4.5.5 6 1.6"/><path d="M12 6.6C13.5 5.5 15.6 5 18 5h3v13h-3c-2.4 0-4.5.5-6 1.6z"/></svg>
        </span>
        <span class="txt">دخول الدرس</span>
        <span class="chev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>

      <!-- Progress card -->
      <section class="progress-card">
        <div class="card-head">
          تقدّمي اليوم
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 7-7"/><path d="M17 7h4v4"/></svg>
        </div>
        <div class="rings">
          <div class="ring-item">
            <div class="ring" style="--p:75">
              <i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5l-1.5-1.4C5.4 14.5 2.5 11.8 2.5 8.6 2.5 6.1 4.5 4 7 4c1.7 0 3.2.9 4 2.2C11.8 4.9 13.3 4 15 4c2.5 0 4.5 2.1 4.5 4.6 0 3.2-2.9 5.9-8 10.5z"/></svg></i>
            </div>
            <span class="pct">75%</span>
          </div>
          <div class="ring-item">
            <div class="ring" style="--p:60">
              <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A2 2 0 0 1 7 3h11v15H7a2 2 0 0 0-2 2z"/><path d="M5 19.5A2 2 0 0 0 7 21h11"/></svg></i>
            </div>
            <span class="pct">60%</span>
          </div>
          <div class="ring-item">
            <div class="ring" style="--p:80">
              <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.6C10.5 5.5 8.4 5 6 5H3v13h3c2.4 0 4.5.5 6 1.6"/><path d="M12 6.6C13.5 5.5 15.6 5 18 5h3v13h-3c-2.4 0-4.5.5-6 1.6z"/><path d="M12 6.6v13"/></svg></i>
            </div>
            <span class="pct">80%</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="stats">
          <div class="col"><div class="name">القرآن</div><div class="msg">ما شاء الله!</div></div>
          <div class="col"><div class="name">التجويد</div><div class="msg">أنت رائع!</div></div>
          <div class="col"><div class="name">السلوك</div><div class="msg">أحسنت!</div></div>
        </div>
      </section>

      <!-- Badge card -->
      <section class="badge-card">
        <div class="art"><img src="assets/badge.png" alt="وسام اليوم" /></div>
        <div class="info">
          <div class="label">وسام اليوم</div>
          <div class="big">مُثابر اليوم</div>
          <div class="sub">أكملت مهمتك اليومية<br/>بارك الله فيك</div>
        </div>
      </section>

    </div>

    <!-- Bottom nav -->
    <nav class="nav">
      <div class="item">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg>
        <span>المزيد</span>
      </div>
      <div class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A2 2 0 0 1 7 3h11v15H7a2 2 0 0 0-2 2z"/><path d="M5 19.5A2 2 0 0 0 7 21h11"/></svg>
        <span>الدروس</span>
      </div>
      <div class="item center">
        <span class="bubble">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
        </span>
        <span>الرئيسية</span>
      </div>
      <div class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="17" height="11" rx="1.6"/><path d="M3 9h18M12 9v11"/><path d="M12 9S10.6 4.5 8 4.5 5.6 9 8 9zM12 9s1.4-4.5 4-4.5S18.4 9 16 9"/></svg>
        <span>المكافآت</span>
      </div>
      <div class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.7 3.1-6 7-6s7 2.3 7 6"/></svg>
        <span>ملفي</span>
      </div>
    </nav>

  </div>
</body>
</html>
